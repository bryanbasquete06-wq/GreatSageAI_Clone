[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "elvea-ai"
version = "1.0.0"
description = "Elívea — Assistente pessoal com IA, controle total do PC, voz e codigo"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Elivea Dev", email = "support@elvea.ai"}
]
keywords = ["ai", "assistant", "voice", "rpg", "windows", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "groq>=0.4.0",
    "sounddevice>=0.4.6",
    "PySide6>=6.5.0",
    "pyautogui>=0.9.54",
    "keyboard>=0.13.5",
    "psutil>=5.9.0",
    "ddgs>=4.0",
]

[project.optional-dependencies]
voice = ["openai-whisper>=20231117", "torch>=2.0.0"]
gemini = ["google-genai>=0.3.0"]
deepseek = ["openai>=1.0.0"]
all = [
    "openai-whisper>=20231117",
    "torch>=2.0.0",
    "google-genai>=0.3.0",
    "openai>=1.0.0",
]

[project.scripts]
elvea = "core.main:main"

[project.gui-scripts]
elvea-gui = "core.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[tool.setuptools.package-data]
core = ["config/*.json", "*.png", "*.ico"]
