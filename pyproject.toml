[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "great-sage-ai"
version = "1.0.0"
description = "Great Sage AI — Assistente pessoal com IA, controle total do PC, voz e codigo"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [
    {name = "Great Sage Dev", email = "support@greatsage.ai"}
]
keywords = ["ai", "assistant", "voice", "rpg", "windows", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "groq>=0.4.0",
    "sounddevice>=0.4.6",
    "PySide6>=6.5.0",
    "pyautogui>=0.9.54",
    "keyboard>=0.13.5",
    "psutil>=5.9.0",
    "ddgs>=4.0",
]

[project.optional-dependencies]
voice = ["openai-whisper>=20231117", "torch>=2.0.0"]
gemini = ["google-genai>=0.3.0"]
deepseek = ["openai>=1.0.0"]
all = [
    "openai-whisper>=20231117",
    "torch>=2.0.0",
    "google-genai>=0.3.0",
    "openai>=1.0.0",
]

[project.scripts]
great-sage = "GreatSageAI_Clone.main:main"

[project.gui-scripts]
great-sage-gui = "GreatSageAI_Clone.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["GreatSageAI_Clone*"]

[tool.setuptools.package-data]
GreatSageAI_Clone = ["config/*.json", "*.png", "*.ico"]
